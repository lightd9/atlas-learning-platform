<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-label="A parent and child learning together at home">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EE"/>
      <stop offset="0.55" stop-color="#F7EBDD"/>
      <stop offset="1" stop-color="#EADCCB"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#E8F4FF"/>
      <stop offset="1" stop-color="#BFD8EC"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B77B4E"/>
      <stop offset="1" stop-color="#8C5636"/>
    </linearGradient>
    <linearGradient id="adultTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D49A53"/>
      <stop offset="1" stop-color="#B97435"/>
    </linearGradient>
    <linearGradient id="childTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E93A5"/>
      <stop offset="1" stop-color="#2F6E82"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="55%">
      <stop offset="0" stop-color="#FFFDF9" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFDF9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5C412B" flood-opacity="0.16"/>
    </filter>
    <filter id="paperShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5C412B" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#background)"/>
  <circle cx="690" cy="230" r="300" fill="url(#glow)"/>

  <!-- Window and morning light -->
  <path d="M590 70h235v500H590z" fill="url(#window)" opacity="0.92"/>
  <path d="M590 70h235v500H590z" fill="none" stroke="#FFFDF8" stroke-width="18"/>
  <path d="M707.5 70v500M590 320h235" stroke="#FFFDF8" stroke-width="12"/>
  <circle cx="770" cy="170" r="54" fill="#FFE9A8" opacity="0.9"/>
  <path d="M590 445c58-40 111-29 156-5 42 23 54 20 79-3v133H590z" fill="#A9C9A4" opacity="0.55"/>
  <path d="M590 480c45-30 92-25 133 2 35 23 65 22 102-6v94H590z" fill="#7FAB8A" opacity="0.42"/>

  <!-- Wall art and shelves -->
  <rect x="84" y="145" width="185" height="132" rx="10" fill="#FFFDF8" opacity="0.74" filter="url(#paperShadow)"/>
  <rect x="104" y="168" width="145" height="8" rx="4" fill="#D8C6B2"/>
  <rect x="104" y="192" width="112" height="8" rx="4" fill="#E7DACA"/>
  <circle cx="142" cy="235" r="20" fill="#E5B77D"/>
  <path d="M112 250c16-20 34-20 51-1 13-15 27-15 41 2z" fill="#A9C9A4"/>
  <rect x="52" y="342" width="282" height="12" rx="6" fill="#A66F45" opacity="0.8"/>
  <rect x="92" y="300" width="22" height="42" rx="3" fill="#7F5B45"/>
  <rect x="120" y="288" width="24" height="54" rx="3" fill="#C88B56"/>
  <rect x="150" y="309" width="20" height="33" rx="3" fill="#4E7E8A"/>
  <path d="M249 342c-8-48 5-75 34-92-4 31-11 59-34 92z" fill="#79A77E"/>
  <path d="M255 342c20-43 46-57 79-57-18 27-42 47-79 57z" fill="#91B98C"/>
  <path d="M252 342c-25-31-30-58-18-84 19 24 27 51 18 84z" fill="#5F926E"/>

  <!-- People -->
  <g filter="url(#softShadow)">
    <!-- Adult -->
    <path d="M198 842c-18 80-22 166-9 246h234c-12-86-15-171-2-246z" fill="url(#adultTop)"/>
    <path d="M232 857c-31 36-54 85-66 147l54 18c13-57 32-101 60-131z" fill="url(#adultTop)"/>
    <path d="M392 860c31 34 52 82 63 143l-54 17c-12-56-31-99-58-128z" fill="url(#adultTop)"/>
    <rect x="314" y="760" width="92" height="104" rx="42" fill="#D7A17B"/>
    <path d="M313 804c-4-62 17-96 50-96s55 32 51 96c-14-22-31-34-51-34s-37 12-50 34z" fill="#3E302A"/>
    <path d="M309 795c-18-13-20-38-4-53 8 17 14 34 4 53z" fill="#3E302A"/>
    <path d="M408 790c19-16 23-40 7-55-9 18-16 36-7 55z" fill="#3E302A"/>
    <circle cx="344" cy="811" r="5" fill="#3E302A"/>
    <circle cx="378" cy="811" r="5" fill="#3E302A"/>
    <path d="M351 845c10 8 22 8 32 0" fill="none" stroke="#8B5A43" stroke-width="5" stroke-linecap="round"/>
    <path d="M367 814c-2 12 0 18 6 20" fill="none" stroke="#B77A58" stroke-width="4" stroke-linecap="round"/>

    <!-- Child -->
    <path d="M535 908c-24 62-35 123-34 180h194c-5-61-17-122-42-180z" fill="url(#childTop)"/>
    <path d="M554 928c-30 30-48 66-56 111l49 12c9-42 24-76 47-101z" fill="url(#childTop)"/>
    <path d="M691 929c28 31 45 68 52 111l-49 11c-9-41-24-75-46-100z" fill="url(#childTop)"/>
    <rect x="584" y="829" width="84" height="96" rx="40" fill="#B77B55"/>
    <path d="M581 856c-3-70 20-105 51-105 34 0 57 35 53 105-16-27-33-40-53-40s-35 13-51 40z" fill="#5A3A2B"/>
    <path d="M576 851c-21-11-27-35-14-54 12 17 19 35 14 54z" fill="#5A3A2B"/>
    <path d="M687 848c22-14 28-38 14-56-12 18-20 37-14 56z" fill="#5A3A2B"/>
    <circle cx="611" cy="865" r="4.5" fill="#38271F"/>
    <circle cx="642" cy="865" r="4.5" fill="#38271F"/>
    <path d="M617 893c8 7 18 7 26 0" fill="none" stroke="#7E4C39" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Table and learning materials -->
  <rect x="0" y="1010" width="900" height="190" fill="url(#table)"/>
  <rect x="0" y="1010" width="900" height="14" fill="#C78A5B"/>
  <g filter="url(#paperShadow)">
    <rect x="245" y="1000" width="330" height="112" rx="12" fill="#33465A"/>
    <rect x="261" y="1012" width="298" height="82" rx="6" fill="#EAF4F5"/>
    <path d="M282 1035h118M282 1052h82M282 1069h139" stroke="#9EBBCD" stroke-width="8" stroke-linecap="round"/>
    <path d="M443 1042c28-18 56-18 84 0v41c-28-18-56-18-84 0z" fill="#FFF4D8"/>
    <circle cx="485" cy="1058" r="8" fill="#D9A85F"/>
  </g>
  <g filter="url(#paperShadow)">
    <rect x="96" y="1030" width="112" height="70" rx="5" fill="#FFFDF8" transform="rotate(-8 152 1065)"/>
    <rect x="705" y="1028" width="104" height="72" rx="5" fill="#F4DCA9" transform="rotate(7 757 1064)"/>
    <path d="M725 1050h62M725 1065h48M725 1080h57" stroke="#B98A4C" stroke-width="6" stroke-linecap="round" transform="rotate(7 757 1064)"/>
  </g>

  <!-- Foreground warmth -->
  <path d="M0 1120c127-26 236-13 329 38 97 53 207 61 331 22 74-23 148-23 240 0v20H0z" fill="#7A4A30" opacity="0.18"/>
</svg>
